services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    command: ["npm", "run", "worker"]
    env_file: .env
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
# Supply a reviewed managed Redis endpoint and private storage.
# This file does not enable billing or provision external services.
