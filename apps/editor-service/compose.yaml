services:
  editor:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./resources:/opt/apryse/resources:ro
